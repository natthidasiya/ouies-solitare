<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neko Sum — ไพ่แมวจับเลข</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1f4;--bg2:#ffe3ec;--cream:#fffaf2;--gold:#f0b54a;--wine:#ff8fab;--ink:#5a3a3a;--red:#e8455e;--mut:#8fa3bd;--txt:#5b4a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff1f4}}
:root[data-theme="dark"]{--bg:#fff1f4}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#fffaf0,#fff7ec 50%,#eef6ff);color:var(--txt);font-family:'Mitr',system-ui,sans-serif;-webkit-user-select:none;user-select:none;overflow-x:hidden}
#app{max-width:760px;margin:0 auto;padding:10px 12px 40px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.lv{font-family:'Mitr',sans-serif;font-weight:500;font-size:24px;line-height:1;color:var(--txt)}
.tag{font-size:12px;padding:3px 11px;border-radius:99px;background:#dcefff;color:#3a78b5}
.tag.hard{background:#ffd6de;color:#d63a5c}
.sp{flex:1}
.stat{font-size:13px;color:var(--mut)}.stat b{color:var(--txt);font-weight:500}
.stat.warn b{color:var(--red)}
button{font:inherit;font-size:13px;border:0;background:#fff;color:var(--txt);border-radius:99px;padding:6px 14px;cursor:pointer;box-shadow:0 3px 0 #bcdcf7}
button:disabled{opacity:.35;cursor:default}
.id{font-size:11px;color:var(--mut);cursor:pointer;text-decoration:underline dotted}
.row{display:flex;gap:var(--gap);align-items:flex-start}
.fnd{margin-bottom:12px;flex-wrap:wrap}
.slot{width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.1);border:2px dashed #a9d2f5;background:rgba(255,255,255,.6);position:relative;flex:none}
.slot.done .card{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(217,164,65,.7)}
.badge{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:#fff;border:2px solid #a9d2f5;color:var(--txt);font-size:11px;padding:0 7px;border-radius:99px;z-index:5;white-space:nowrap}
.mid{margin-bottom:26px;align-items:center}
.card{width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.1);position:absolute;left:0;background:var(--cream);box-shadow:0 3px 8px rgba(120,160,200,.28);overflow:hidden;transition:transform .12s}
.card.base{background-size:cover;background-position:center}
.num{position:absolute;font-family:'Fredoka','Mitr',sans-serif;font-weight:700;font-size:calc(var(--cw)*.27);line-height:1;padding:0 2px;background:rgba(255,250,242,.88);border-radius:6px}
.num.tl{left:7%;top:4%}.num.br{right:7%;bottom:4%;transform:rotate(180deg)}
.eq{border:0}
.eq::after{content:"";position:absolute;inset:5%;border:2px solid #ffc6d3;border-radius:calc(var(--cw)*.07);pointer-events:none}
.hd{position:absolute;width:27%}.hd.tl{left:6%;top:5%}.hd.br{right:6%;bottom:5%;transform:rotate(180deg)}
.op{width:.62em;height:.62em;flex:none}
.mini{position:absolute;right:9%;top:9%;font-family:'Fredoka','Mitr',sans-serif;font-weight:700;display:flex;align-items:center;gap:1px;font-size:calc(var(--cw)*.13);color:var(--ink)}
.ex{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka','Mitr',sans-serif;font-size:calc(var(--cw)*.23);color:var(--txt);font-weight:700;gap:.12em}
.back{background:radial-gradient(circle,#fff 2.2px,transparent 2.6px) 0 0/12px 12px,#9fcff5;border:3px solid #fff}
.back img{position:absolute;width:56%;left:22%;top:28%;background:#fff;border-radius:50%;padding:6%}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:rotate(-4deg) scale(1.06);box-shadow:0 10px 20px rgba(90,120,160,.35)}
[data-drag]{touch-action:none;cursor:grab}
.sel{transform:translateY(-6px);box-shadow:0 0 0 3px #ff7a9c,0 8px 14px rgba(255,122,156,.45)}
.pile{width:var(--cw);height:var(--ch);position:relative;flex:none;cursor:pointer}
.pile .cnt{position:absolute;inset:auto 0 -18px 0;text-align:center;font-size:11px;color:var(--mut)}
.empty{border-radius:calc(var(--cw)*.1);border:2px dashed #ffc6d3;background:rgba(255,255,255,.55);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:20px}
.tab{gap:var(--gap)}
.col{width:var(--cw);position:relative;flex:none;min-height:var(--ch)}
.col .empty{height:var(--ch);inset:0 0 auto 0}
.modal{position:fixed;inset:0;background:rgba(225,240,255,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.box{background:#fff;color:var(--txt);border-radius:24px;padding:26px 28px;max-width:320px;text-align:center;border:3px solid #ffc6d3;box-shadow:0 6px 0 #bcdcf7}
.box h2{font-family:'Fredoka','Mitr',sans-serif;font-size:34px;margin:0 0 6px}
.box p{margin:0 0 16px;font-size:14px}
.box button{background:#ff8fab;color:#fff;font-size:15px;padding:9px 22px;box-shadow:0 3px 0 #e86d8c}
</style></head><body><div id="app">
<header><span class="lv" id="lv"></span><span class="tag" id="df"></span><span class="sp"></span>
<span class="stat" id="mv"></span><span class="stat" id="dr"></span><button id="ud"></button></header>
<div class="row fnd" id="fnd"></div>
<div class="row mid"><div class="pile" id="stock"></div><div class="pile" id="waste"></div><span class="sp"></span><span class="id" id="idc"></span></div>
<div class="row tab" id="tab"></div></div>
<div class="modal" id="md"><div class="box"><h2 id="mt"></h2><p id="mp"></p><button id="mb"></button></div></div>

const key=s=>s.cols.map((c,i)=>s.down[i]+':'+c.join(',')).join('|')+'#'+s.stock.join(',')+'#'+s.waste.join(',');
function solve(s0){const seen=new Set();let nodes=0;
 function rec(s,m,d,dep){if(++nodes>25000||dep>500)return null;m+=autoF(s);if(won(s))return{m,d};
  const k=key(s);if(seen.has(k))return null;seen.add(k);
  for(const x of gen(s,1)){const n=cl(s);apply(n,x);const r=rec(n,m+(x.t=='d'?0:1),d+(x.t=='d'?1:0),dep+1);if(r)return r}return null}
 return rec(cl(s0),0,0,0)}
// ---- storage / id
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const qp=new URLSearchParams(location.search),hp=new URLSearchParams(location.hash.slice(1));
let ID=qp.get('id')||hp.get('id')||LS.get('neko:last')||('cat-'+Math.random().toString(36).slice(2,7));
let P,G;
function loadP(){P=LS.get('neko:'+ID)||{level:1,used:[]};LS.set('neko:last',ID)}
function saveP(){LS.set('neko:'+ID,P)}
function start(){const hard=isHard(P.level);let k=P.used.length,res,st,seed;
 for(let t=0;t<200;t++){seed=hs(ID+'|'+P.level+'|'+(k+t));if(P.used.includes(seed))continue;st=deal(P.level,seed);res=solve(st);if(res)break}
 P.used.push(seed);saveP();
 const ml=Math.ceil(res.m*(hard?1.12:1.3))+(hard?2:4),dl=Math.ceil(res.d*(hard?1.15:1.4))+(hard?3:6);
 G={s:st,moves:0,draws:0,undo:2,hist:[],ml,dl,sel:null,hard,seed};render()}
// ---- UI
const OPS={'+':'<path d="M12 4v16M4 12h16"/>','−':'<path d="M4 12h16"/>','×':'<path d="M6 6l12 12M18 6L6 18"/>','÷':'<path d="M4 12h16"/><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/>'};
const fx=x=>x.replace(/[+−×÷]/,o=>`<svg class="op" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round">${OPS[o]}</svg>`);
function cardEl(id,face){const d=document.createElement('div');
 if(!face){d.className='card back';d.innerHTML=`<img src="${A.heads[0]}">`;return d}
 const c=C[id];
 if(c.t=='b'){d.className='card base';d.style.backgroundImage=`url(${A.bases[c.img].src})`;const col=A.bases[c.img].red?'var(--red)':'var(--ink)';
  d.innerHTML=`<span class="num tl" style="color:${col}">${c.v}</span><span class="num br" style="color:${col}">${c.v}</span>`}
 else{d.className='card eq';d.innerHTML=`<img class="hd tl" src="${A.heads[c.h]}"><span class="mini">${fx(c.x)}</span><div class="ex">${fx(c.x)}</div><img class="hd br" src="${A.heads[c.h]}">`}
 return d}
function size(){const n=G.s.cols.length,gap=Math.min(8,Math.max(4,innerWidth/120));const cw=Math.min(96,Math.floor((Math.min(innerWidth,760)-24-gap*(n-1))/n));
 const r=document.documentElement.style;r.setProperty('--cw',cw+'px');r.setProperty('--ch',Math.round(cw*1.4)+'px');r.setProperty('--gap',gap+'px');return cw}
function render(){const s=G.s,cw=size(),ch=cw*1.4;
 $('#lv').textContent='ด่าน '+P.level;const df=$('#df');df.textContent=G.hard?'ยาก':'กลาง';df.className='tag'+(G.hard?' hard':'');
 $('#mv').innerHTML=`เดิน <b>${G.moves}/${G.ml}</b>`;$('#mv').className='stat'+(G.ml-G.moves<=3?' warn':'');
 $('#dr').innerHTML=`จั่ว <b>${G.draws}/${G.dl}</b>`;$('#dr').className='stat'+(G.dl-G.draws<=2?' warn':'');
 const ud=$('#ud');ud.textContent='ย้อน ('+G.undo+')';ud.disabled=!G.undo||!G.hist.length;
 $('#idc').textContent='ID: '+ID;
 const F=$('#fnd');F.innerHTML='';SETS.forEach((st,i)=>{const sl=document.createElement('div');sl.className='slot';sl.dataset.f=1;const f=s.f[i];
  if(f.b){const e=cardEl(C.find(c=>c.t=='b'&&c.s==i).id,1);sl.appendChild(e);if(f.n==st.k)sl.classList.add('done');sl.insertAdjacentHTML('beforeend',`<span class="badge">${f.n}/${st.k}</span>`)}
  else sl.insertAdjacentHTML('beforeend',`<span class="badge">0/${st.k}</span>`);F.appendChild(sl)});
 const S=$('#stock');S.innerHTML='';if(s.stock.length)S.appendChild(cardEl(0,0));else S.innerHTML='<div class="empty">↻</div>';
 S.insertAdjacentHTML('beforeend',`<span class="cnt">${s.stock.length}</span>`);
 const W=$('#waste');W.innerHTML='';if(s.waste.length){const e=cardEl(tp(s.waste),1);e.dataset.drag='w';if(G.sel&&G.sel.w)e.classList.add('sel');W.appendChild(e)}else W.innerHTML='<div class="empty"></div>';
 const T=$('#tab');T.innerHTML='';s.cols.forEach((c,i)=>{const col=document.createElement('div');col.className='col';col.dataset.col=i;col.onclick=()=>tapCol(i);
  let y=0;if(!c.length)col.innerHTML='<div class="empty"></div>';
  c.forEach((id,k)=>{const face=k>=s.down[i];const e=cardEl(id,face);e.style.top=y+'px';e.style.zIndex=k;
   if(k==c.length-1)e.dataset.drag='c'+i;if(G.sel&&G.sel.c===i&&k==c.length-1)e.classList.add('sel');col.appendChild(e);y+=face?cw*.42:cw*.16});
  col.style.height=(c.length?y-(c.length&&s.down[i]<c.length?cw*.42:cw*.16)+ch:ch)+'px';T.appendChild(col)})}
function snap(){G.hist.push({s:cl(G.s),moves:G.moves,draws:G.draws});if(G.hist.length>5)G.hist.shift()}
function after(){G.sel=null;render();const s=G.s;
 if(won(s)){P.level++;saveP();return modal('ชนะ!',`ใช้ ${G.moves} ตา · จั่ว ${G.draws} ครั้ง`,'ด่านต่อไป',start)}
 if(G.moves>=G.ml)return over('เดินครบลิมิตแล้ว');
 const canAny=s.cols.some(c=>c.length&&canF(s,tp(c)))||(s.waste.length&&canF(s,tp(s.waste)))||gen(s).some(x=>x.t!='d'&&x.p<3);
 const canDraw=(s.stock.length&&G.draws<G.dl)||(!s.stock.length&&s.waste.length&&G.draws<G.dl);
 if(!canAny&&!canDraw&&!gen(s).some(x=>x.t!='d'))over('ไม่มีทางไปต่อ')}
function over(m){modal('Over',m+' — เริ่มด่านนี้ใหม่ด้วยการสลับใหม่','เล่นใหม่',start)}
function modal(t,p,b,fn){$('#mt').textContent=t;$('#mp').textContent=p;$('#mb').textContent=b;$('#md').classList.add('on');$('#mb').onclick=()=>{$('#md').classList.remove('on');fn()}}
function act(f){snap();f();G.moves++;after()}
$('#stock').onclick=()=>{const s=G.s;if(!s.stock.length){if(s.waste.length){snap();s.stock=s.waste.reverse();s.waste=[];G.sel=null;render()}return}
 if(G.draws>=G.dl)return;snap();s.waste.push(s.stock.pop());G.draws++;after()};
$('#waste').onclick=()=>{const s=G.s;if(!s.waste.length)return;const id=tp(s.waste);
 if(canF(s,id))return act(()=>toF(s,s.waste.pop()));G.sel=G.sel&&G.sel.w?null:{w:1};render()};
function tapCol(i){const s=G.s,c=s.cols[i];
 if(G.sel){const sel=G.sel;if(sel.c===i){G.sel=null;return render()}
  const id=sel.w?tp(s.waste):tp(s.cols[sel.c]);
  if(fits(s,id,i)&&!(sel.c!=null&&!c.length&&s.cols[sel.c].length==1)){return act(()=>s.cols[i].push(sel.w?s.waste.pop():popC(s,sel.c)))}
  if(!c.length){G.sel=null;return render()}}
 if(!c.length)return;const id=tp(c);
 if(canF(s,id))return act(()=>toF(s,popC(s,i)));G.sel={c:i};render()}

const srcId=src=>src=='w'?tp(G.s.waste):tp(G.s.cols[+src.slice(1)]);
const take=src=>src=='w'?G.s.waste.pop():popC(G.s,+src.slice(1));
function tryTo(src,dst){const s=G.s,id=srcId(src);if(id==null)return false;
 if(dst=='f'){if(!canF(s,id))return false;act(()=>toF(s,take(src)));return true}
 const j=+dst;if(src=='c'+j||!fits(s,id,j))return false;
 if(src!='w'&&!s.cols[j].length&&s.cols[+src.slice(1)].length==1)return false;
 act(()=>s.cols[j].push(take(src)));return true}
let D=null,noClick=false;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-drag]');if(!el||$('#md').classList.contains('on'))return;
 const r=el.getBoundingClientRect();D={el,src:el.dataset.drag,x0:e.clientX,y0:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,g:null}});
document.addEventListener('pointermove',e=>{if(!D)return;
 if(!D.g){if(Math.hypot(e.clientX-D.x0,e.clientY-D.y0)<6)return;D.g=D.el.cloneNode(true);D.g.classList.add('ghost');D.g.classList.remove('sel');
  D.g.style.width=D.w+'px';D.g.style.height=D.w*1.4+'px';document.body.appendChild(D.g);D.el.style.visibility='hidden'}
 e.preventDefault();D.g.style.left=e.clientX-D.dx+'px';D.g.style.top=e.clientY-D.dy+'px'},{passive:false});
function endDrag(e){if(!D)return;const d=D;D=null;if(!d.g)return;noClick=true;setTimeout(()=>noClick=false,50);d.g.remove();
 const t=document.elementFromPoint(e.clientX,e.clientY),f=t&&t.closest('[data-f],#fnd'),c=t&&t.closest('[data-col]');
 G.sel=null;if(!((f&&tryTo(d.src,'f'))||(c&&tryTo(d.src,c.dataset.col))))render()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('click',e=>{if(noClick){e.stopPropagation();e.preventDefault()}},true);
$('#ud').onclick=()=>{if(!G.undo||!G.hist.length)return;const h=G.hist.pop();G.s=h.s;G.moves=h.moves;G.draws=h.draws;G.undo--;G.sel=null;render()};
$('#idc').onclick=()=>{const v=prompt('ใส่ ID (เริ่มนับด่านแยกตาม ID)',ID);if(v&&v.trim()){ID=v.trim();loadP();start()}};
addEventListener('resize',()=>G&&render());
loadP();start();
</script></body></html>
